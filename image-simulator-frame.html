<style>html,body{height:100%;margin:0;background:#000;overflow:hidden}*{box-sizing:border-box}

@keyframes shindo-soft-box-shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-1.5px,.5px)}40%{transform:translate(1.5px,-.5px)}60%{transform:translate(-1px,-.5px)}80%{transform:translate(1px,.5px)}}
#sim-vn .vn-box .shindo-area-skip{position:absolute;right:14px;top:8px;z-index:18;min-width:82px;padding:4px 10px;background:rgba(40,42,46,.96);border:1px solid #777;border-radius:7px;color:#f5f5f5;font-size:12px;font-weight:700;letter-spacing:-.04em;cursor:pointer;line-height:1.5}

#sim-vn .vn-portrait{transition:opacity .65s ease}#sim-vn .vn-illustration{transition:opacity .65s ease}#sim-vn .vn-duo{display:block}

</style></head><body>
<div id="sim-story-underlay"></div><div id="sim-story-backdrop"></div>
<div id="sim-vn" class="active day"><img class="vn-illustration" id="art" alt="" hidden><div class="vn-duo" id="duo"><img class="duo-left" id="left" alt="" hidden><img class="duo-right" id="right" alt="" hidden></div><img class="vn-portrait" id="portrait" alt="" hidden><div class="vn-box"><div class="vn-speaker" id="speaker">김봉봉</div><span class="vn-text" id="dialogue">업로드한 이미지가 실제 화면에 어떻게 배치되는지 확인할 수 있어요.</span></div><div class="vn-hint">화면을 터치하거나 클릭하여 진행</div><div class="vn-evidence-demo" id="evidence"><div class="shindo-evidence-card"><div class="shindo-evidence-kicker">증거품 획득</div><img id="evidence-img" alt="증거품"><div class="shindo-evidence-title" id="evidence-title">파기된 문서</div><div class="shindo-evidence-desc" id="evidence-desc">증거품 설명</div><button type="button" class="shindo-evidence-confirm">확인</button></div></div></div>
<script>
const $=id=>document.getElementById(id);
const names={junhui:/^준휘/,hansol:/^한솔/,soonyoung:/^순영/,minghao:/^명호/,wonwoo:/^원우/,jihoon:/^지훈/,seungcheol:/^승철/,seokmin:/^석민/,chan:/^찬/,elder:/^노인네/};
const profiles={junhui:{scale:1,maxWidth:'none'},hansol:{scale:1.04,y:'0px',height:'min(60vh,620px)'},soonyoung:{scale:1.02},minghao:{scale:1.04,y:'0px',height:'min(60vh,620px)'},wonwoo:{scale:1.08},jihoon:{scale:1.03},seungcheol:{scale:.97},seokmin:{scale:1},chan:{scale:1},elder:{scale:1.02}};
const current={};let currentData={};
function detectKey(filename){const name=(filename||'').normalize('NFC');for(const [id,rx] of Object.entries(names))if(rx.test(name))return id;return '';}
function junhuiCenterCompensation(filename,baseHeightPct){
 const name=(filename||'').normalize('NFC');if(!name.startsWith('준휘_'))return 0;
 let ratio=0;
 if(/준휘_바디2_(?:기본|미소|의심)/.test(name))ratio=-64/2002;
 else if(/준휘_바디2_(?:눈웃음|간식먹음이)/.test(name)||/준휘_바디3_간식먹음이/.test(name))ratio=123.5/2021;
 else if(/준휘_바디1_/.test(name))ratio=3/2020;
 else if(/준휘_바디3_/.test(name))ratio=3.5/2020;
 return Math.round(-ratio*(Number.isFinite(baseHeightPct)?innerHeight*baseHeightPct/100:Math.min(innerHeight*(innerWidth<=750?.60:.66),innerWidth<=750?620:740))*100)/100;
}
function applyProfile(el,filename,opts={}){
 const id=opts.character||detectKey(filename), p=profiles[id]||{}, scale=opts.manualScale || p.scale || 1;
 el.style.setProperty('--portrait-scale',String(scale));
 const correction=id==='junhui'?junhuiCenterCompensation(filename,opts.baseHeightPct):0;
 el.style.setProperty('--portrait-offset-x', correction?`calc(-50% + ${correction}px)`:'-50%');
 el.style.setProperty('--portrait-offset-y',p.y||'0px');
 el.style.bottom=p.bottom||'';el.style.removeProperty('height');el.style.height=p.height||'';if(Number.isFinite(opts.baseHeightPct))el.style.setProperty('height',opts.baseHeightPct+'vh','important');el.style.maxWidth=p.maxWidth||'';el.style.width='auto';
 el.classList.toggle('special-solo',opts.style==='special');
 if(opts.style==='special')el.style.setProperty('--portrait-scale','1');
 el.classList.toggle('prayer-silhouette',opts.style==='prayer');
 el.classList.toggle('art-silhouette',opts.style==='silhouette');
 el.classList.toggle('living-silhouette',opts.style==='silhouette');
 el.classList.toggle('main-silhouette',opts.style==='silhouette');
 el.classList.toggle('evening-shadow',opts.style==='dim');
 el.style.setProperty('--evening-portrait-brightness',String(1-(opts.dim||0)));
 if(opts.style==='normal'||opts.style==='special'||opts.style==='duo')el.style.filter='';
}
function update(d){currentData=d;const bg=$('sim-story-backdrop');const shade=(d.bgShade??0);
 bg.style.backgroundImage=d.background?`linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.46)), url(${JSON.stringify(d.background)})`:'linear-gradient(#050607,#050607)';
 bg.style.filter=shade?'brightness('+(1-shade)+')':'';
 const bgScale=Math.min(200,Math.max(50,Number(d.backgroundScalePct)||100));
 bg.style.transform=`scale(${bgScale/100})`;bg.style.transformOrigin='center center';
 $('speaker').textContent=d.speaker||'';$('dialogue').textContent=d.dialogue||'일러스트 크기와 배경의 실제 배치를 확인합니다.';
 const portrait=$('portrait'),art=$('art'),duo=$('duo');
 portrait.hidden=!d.portrait||d.type==='illustration'||d.type==='duo'||d.type==='evidence';
 if(d.portrait){portrait.src=d.portrait;applyProfile(portrait,d.portraitFilename,{style:d.portraitStyle,character:d.character,manualScale:d.manualScale,dim:d.dim,baseHeightPct:d.baseHeightPct});}
 art.hidden=!(d.type==='illustration' && d.illustration);if(d.illustration)art.src=d.illustration;
 duo.classList.toggle('is-active',d.type==='duo');for(const [key,el] of [['duoLeft',$('left')],['duoRight',$('right')]]){el.hidden=!d[key];if(d[key])el.src=d[key];el.classList.toggle('is-shadow',!!d.duoSilhouette);}
