@keyframes historyStaticFlash{0%{opacity:0}8%{opacity:.9}17%{opacity:.23}29%{opacity:1}42%{opacity:.4}56%{opacity:.92}69%{opacity:.14}83%{opacity:.85}100%{opacity:0}}
@keyframes historyStaticShift{0%{transform:translate(0,0) skewX(0deg)}33%{transform:translate(-9px,15px) skewX(1deg)}66%{transform:translate(13px,-7px) skewX(-1deg)}100%{transform:translate(-4px,8px)}}

const homeHTML=`<h1>카밀레교 홈페이지에 오신 모든 분을 환영합니다.</h1><p class="quote">“만물의 본질은 자연(Flux)이다.”</p><div class="body"><p>구원은 도덕적 선행이나 계율의 준수가 아닙니다.<br>진정한 구원은 생동입니다. 새로운 흐름입니다.<br>겨울은 가고 봄이 오는 것처럼,<br>우리는 달콤한 겸손을 알고 오만한 추락을 경계합니다.</p><p>역경을 짊어진 소명자로서 신의 곁에서 예배드립니다.<br>진리를 실천하고 인내하는 자에게는 카밀레교 새로운 길이 꽃핍니다.</p></div>`;

function recordIntroView(view){
 let views=[];try{views=JSON.parse(localStorage.getItem(INTRO_VIEWS_KEY)||'[]');if(!Array.isArray(views))views=[]}catch(e){}
 if(!views.includes(view)){views.push(view);try{localStorage.setItem(INTRO_VIEWS_KEY,JSON.stringify(views))}catch(e){}}
 if(INTRO_REQUIRED.every(x=>views.includes(x))){
  try{window.parent.postMessage({type:'kamille-intro-complete-v32'},location.origin)}catch(e){}
 }
}

let historyTimers=[];
function cancelHistory(){historyTimers.forEach(clearTimeout);historyTimers=[];const overlay=document.getElementById('history-interruption');overlay.className='';document.getElementById('history-static').classList.remove('active');document.getElementById('faq-transition').classList.remove('show');}
function startHistory(){
 // Blink for 2.6 seconds, then brief dark glitch with warning for 0.5 seconds.
 historyTimers.push(setTimeout(()=>{
   if(currentPage!=='카밀레교의 역사')return;
   const staticLayer=document.getElementById('history-static');
   staticLayer.classList.remove('active');
   void staticLayer.offsetWidth;
   staticLayer.classList.add('active');
   historyTimers.push(setTimeout(()=>{
     if(currentPage!=='카밀레교의 역사')return;
     staticLayer.classList.remove('active');
     const overlay=document.getElementById('history-interruption');overlay.className='show glitch';
     historyTimers.push(setTimeout(()=>{
       if(currentPage==='카밀레교의 역사'){document.getElementById('history-interruption').className='';document.getElementById('faq-transition').classList.add('show');historyTimers.push(setTimeout(()=>{document.getElementById('faq-transition').classList.remove('show');render('자주 묻는 질문');},300));}
     },500));
   },420));
 },2600));
}

function render(page,updateHash=true){cancelHistory();if(page==='카밀레교의 역사')page='자주 묻는 질문';if(page==='자주 묻는 질문'&&shouldShowHistory())page='카밀레교의 역사';currentPage=page;if(page==='목양 안내'||page==='목양')page='신도 등록';const idx=groups.findIndex(g=>g.menu.includes(page));if(idx>=0)currentGroup=idx;const g=groups[currentGroup];document.getElementById('sideTitle').textContent=g.heading;document.getElementById('sideDesc').textContent=g.description;document.getElementById('sideLinks').innerHTML=g.side.map(x=>`<button data-page="${x}" class="${page===x?'active':''}">${x}</button>`).join('');document.querySelector('.main-area').style.display=page==='로그인'?'none':'';let loginHost=document.getElementById('churchLoginHost');if(!loginHost){loginHost=document.createElement('div');loginHost.id='churchLoginHost';document.querySelector('.main-area').after(loginHost)}loginHost.innerHTML=page==='로그인'?signinHTML(false):'';document.getElementById('content').innerHTML=page==='신도 등록'?(localStorage.getItem('kamille_church_logged_in')==='yes'?registerDoneHTML:registerLockedHTML):page==='교회 안내'?homeHTML:page==='카밀레교의 소명'?missionHTML:page==='자주 묻는 질문'?faqHTML:page==='자주 묻는 질문'?'<h1>카밀레교의 역사</h1><p class="history-loading">로딩중입니다. 잠시만 기다려주세요...</p>':page==='카밀레교의 교리'?doctrineHTML:page==='카밀레교 지도'?mapHTML:page==='신도 새 모임'?meetingHTML:groups[2].menu.includes(page)?comingHTML('찬양'):groups[3].menu.includes(page)?comingHTML('훈련'):`<h1>${page}</h1><p class="placeholder">이 페이지의 상세 내용은 추후 추가될 예정입니다.</p>`;if(page==='카밀레교의 소명'){missionIndex=0;updateMission();}if(page==='자주 묻는 질문'){faqIndex=0;updateFAQ();}if(page==='카밀레교의 역사')startHistory();if(page==='교회 안내'||page==='카밀레교의 교리')recordIntroView(page);closeMenus();mobile.classList.remove('show');document.getElementById('mobileToggle').setAttribute('aria-expanded','false');if(updateHash)history.replaceState(null,'','#'+encodeURIComponent(page));}
